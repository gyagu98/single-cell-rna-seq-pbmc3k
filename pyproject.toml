[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbmc3k-scanpy-workflow"
version = "0.1.0"
description = "Reproducible Scanpy workflow for 10x Genomics PBMC 3k data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "scanpy>=1.10,<2",
  "anndata>=0.10,<1",
  "matplotlib>=3.8,<4",
  "leidenalg>=0.10,<0.11",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
pbmc3k = "pbmc3k_workflow.workflow:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
